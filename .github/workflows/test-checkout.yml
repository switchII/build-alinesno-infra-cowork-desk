name: test checkout

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '指定要构建的 Git tag（留空则使用最新 tag）'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [trigger-build]

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '24'
  SOURCE_DIR: source
  QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
  QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
  QINIU_DIR: aip-cowork-releases/

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      tag: ${{ steps.extract-version.outputs.TAG }}

    steps:
      - name: Clone source repository and checkout target tag
        id: clone-tag
        shell: bash
        run: |
          REPO="${{ secrets.COWORK_GIT_REPOSITORY_URL }}"
          REPO="${REPO#https://}"
          REPO="${REPO#http://}"
          REPO_URL="https://${{ secrets.COWORK_GIT_REPOSITORY_USER }}:${{ secrets.COWORK_GIT_REPOSITORY_PASSWORD }}@${REPO}"
          
          git clone "$REPO_URL" source
          cd source
          
          echo "===> 拉取最新 Tags..."
          git fetch --tags --force
          
          echo "===> 仓库所有 Tags："
          git tag --list
          
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            SELECTED_TAG="${{ github.event.inputs.tag }}"
            echo "===> 使用手动输入的 Tag：$SELECTED_TAG"
          else
            echo "===> 未输入 Tag，自动获取最新 Tag..."
            SELECTED_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --tags --max-count=1 | xargs git describe --tags 2>/dev/null)
            if [ -z "$SELECTED_TAG" ]; then
              echo "❌ 错误：仓库中没有任何 Tag！"
              exit 1
            fi
            echo "===> 自动获取到最新 Tag：$SELECTED_TAG"
          fi
          
          git checkout "$SELECTED_TAG"
          echo "===> 最终使用的 Tag：$SELECTED_TAG"
          echo "SELECTED_TAG=$SELECTED_TAG" >> $GITHUB_OUTPUT

          echo -e "\n====================================="
          echo "📄 查看文件：src-tauri/tauri.conf.json"
          echo "====================================="
          cat src-tauri/tauri.conf.json
          echo -e "=====================================\n"

          # ↓↓↓ 在这里加上下面的代码 ↓↓↓
          echo -e "\n====================================="
          echo "📝 最后一次 Git 提交日志"
          echo "====================================="
          git log -1 --stat
          # ↑↑↑ 结束 ↑↑↑

      - name: Extract version from tag
        id: extract-version
        shell: bash
        run: |
          TAG="${{ steps.clone-tag.outputs.SELECTED_TAG }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          
          echo "✅ 最终版本信息："
          echo "Tag = $TAG"
          echo "版本号 = $VERSION"
