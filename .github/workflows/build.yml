# ============================================================================
# AIPCowork Build & Release
# ============================================================================
# 从指定 Git 仓库拉取 Tauri 源码，构建 macOS / Windows 桌面安装包。
#
# 触发方式：
#   1. 手动触发（workflow_dispatch），可指定 tag（留空则用最新 tag）
#   2. 通过 repository_dispatch 由源仓库 tag push 事件自动触发
#
# 版本号策略：
#   - 手动指定 tag 时，使用该 tag 作为版本号
#   - 未指定时，自动获取源仓库最新 tag 作为版本号
#
# 所需 Secrets：
#   COWORK_GIT_REPOSITORY_URL      - Git 仓库地址（不含协议头，如 github.com/org/repo.git）
#   COWORK_GIT_REPOSITORY_USER     - Git 仓库用户名
#   COWORK_GIT_REPOSITORY_PASSWORD - Git 仓库密码 / Token
# ============================================================================

name: build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '指定要构建的 Git tag（留空则使用最新 tag）'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [trigger-build]

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '24'
  SOURCE_DIR: source

jobs:
  # ==========================================================================
  # 确定版本号 —— 获取源仓库最新 tag
  # ==========================================================================
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      tag: ${{ steps.extract-version.outputs.TAG }}

    steps:
      - name: Clone source repository and checkout target tag
        id: clone-tag
        shell: bash
        run: |
          REPO="${{ secrets.COWORK_GIT_REPOSITORY_URL }}"
          REPO="${REPO#https://}"
          REPO="${REPO#http://}"

          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "Using specified tag: ${{ github.event.inputs.tag }}"
            git clone --depth 1 \
              --branch "${{ github.event.inputs.tag }}" \
              "https://${{ secrets.COWORK_GIT_REPOSITORY_USER }}:${{ secrets.COWORK_GIT_REPOSITORY_PASSWORD }}@${REPO}" \
              ${{ env.SOURCE_DIR }}
            SELECTED_TAG="${{ github.event.inputs.tag }}"
          else
            git clone --depth 1 \
              "https://${{ secrets.COWORK_GIT_REPOSITORY_USER }}:${{ secrets.COWORK_GIT_REPOSITORY_PASSWORD }}@${REPO}" \
              ${{ env.SOURCE_DIR }}
            cd ${{ env.SOURCE_DIR }}
            git fetch --tags --depth 1 2>/dev/null || git fetch --tags
            LATEST_TAG=$(git tag --sort=-creatordate | head -1)
            if [ -z "$LATEST_TAG" ]; then
              echo "ERROR: No tags found in source repository"
              exit 1
            fi
            echo "Using latest tag: $LATEST_TAG"
            git checkout "$LATEST_TAG"
            SELECTED_TAG="$LATEST_TAG"
          fi
          echo "SELECTED_TAG=$SELECTED_TAG" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        id: extract-version
        shell: bash
        run: |
          TAG="${{ steps.clone-tag.outputs.SELECTED_TAG }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (tag: $TAG)"

      - name: Upload source for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: ${{ env.SOURCE_DIR }}
          retention-days: 1

  # ==========================================================================
  # Job 1：专门构建 macOS - Arm64 (Apple Silicon)
  # ==========================================================================
  build-macos-arm64:
    needs: [determine-version]
    name: macOS (Arm64)
    runs-on: macos-latest
    
    steps:
      - name: Download source code
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: ${{ env.SOURCE_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get npm cache directory
        id: npm-cache
        shell: bash
        run: echo "DIR=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.DIR }}
          key: ${{ runner.os }}-npm-arm64-${{ hashFiles(format('{0}/package.json', env.SOURCE_DIR)) }}
          restore-keys: ${{ runner.os }}-npm-arm64-

      - name: Install frontend dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install

      - name: Install macOS system dependencies
        run: |
          brew install libpq mysql-client openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mysql-client)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SOURCE_DIR }}/src-tauri -> target
          shared-key: macos-arm64

      - name: Inject version and patch build command in tauri.conf.json
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          jq --arg v "$VERSION" \
            '.version = $v
             | .productName = ("AIPCowork-" + $v)
             | .build.beforeBuildCommand = (.build.beforeBuildCommand | gsub("pnpm build"; "npm run build"))
             | .build.beforeDevCommand = (.build.beforeDevCommand | gsub("pnpm dev"; "npm run dev"))' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp.json && \
            mv src-tauri/tauri.conf.tmp.json src-tauri/tauri.conf.json

      - name: Build Tauri app
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          export CFLAGS="-arch arm64"
          export OPENSSL_STATIC=1
          export OPENSSL_VENDORED=1
          export CC="clang"
          export AR="ar"
          npx tauri build --target aarch64-apple-darwin

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-${{ needs.determine-version.outputs.version }}-macOS-arm64-dmg
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-${{ needs.determine-version.outputs.version }}-macOS-arm64-app
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

