name: build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '指定要构建的 Git tag（留空则使用最新 tag）'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [trigger-build]

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '24'
  SOURCE_DIR: source
  QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
  QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
  QINIU_DIR: aip-cowork-releases/

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      tag: ${{ steps.extract-version.outputs.TAG }}

    steps:
      - name: Clone source repository and checkout target tag
        id: clone-tag
        shell: bash
        run: |
          REPO="${{ secrets.COWORK_GIT_REPOSITORY_URL }}"
          REPO="${REPO#https://}"
          REPO="${REPO#http://}"
          REPO_URL="https://${{ secrets.COWORK_GIT_REPOSITORY_USER }}:${{ secrets.COWORK_GIT_REPOSITORY_PASSWORD }}@${REPO}"
          
          git clone "$REPO_URL" source
          cd source
          
          echo "===> 拉取最新 Tags..."
          git fetch --tags --force
          
          echo "===> 仓库所有 Tags："
          git tag --list
          
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            SELECTED_TAG="${{ github.event.inputs.tag }}"
            echo "===> 使用手动输入的 Tag：$SELECTED_TAG"
          else
            echo "===> 未输入 Tag，自动获取最新 Tag..."
            SELECTED_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --tags --max-count=1 | xargs git describe --tags 2>/dev/null)
            if [ -z "$SELECTED_TAG" ]; then
              echo "❌ 错误：仓库中没有任何 Tag！"
              exit 1
            fi
            echo "===> 自动获取到最新 Tag：$SELECTED_TAG"
          fi
          
          git checkout "$SELECTED_TAG"
          echo "===> 最终使用的 Tag：$SELECTED_TAG"
          echo "SELECTED_TAG=$SELECTED_TAG" >> $GITHUB_OUTPUT

          echo -e "\n====================================="
          echo "📄 查看文件：src-tauri/tauri.conf.json"
          echo "====================================="
          cat src-tauri/tauri.conf.json
          echo -e "=====================================\n"

          # ↓↓↓ 在这里加上下面的代码 ↓↓↓
          echo -e "\n====================================="
          echo "📝 最后一次 Git 提交日志"
          echo "====================================="
          git log -1 --stat
          # ↑↑↑ 结束 ↑↑↑

      - name: Extract version from tag
        id: extract-version
        shell: bash
        run: |
          TAG="${{ steps.clone-tag.outputs.SELECTED_TAG }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          
          echo "✅ 最终版本信息："
          echo "Tag = $TAG"
          echo "版本号 = $VERSION"
 
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: source
          retention-days: 1

  build-macos-arm64:
    needs: [determine-version]
    name: macOS (Arm64)
    runs-on: macos-latest
    
    steps:
      - name: Download source code
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: ${{ env.SOURCE_DIR }}
          
      - name: Verify code version
        shell: bash
        run: |
          cd ${{ env.SOURCE_DIR }}
          echo "====================================="
          echo "✅ 验证代码版本（无git，不报错）"
          echo "====================================="

          echo -e "\n====================================="
          echo "📄 src-tauri/tauri.conf.json 版本号"
          echo "====================================="
          cat src-tauri/tauri.conf.json | grep '"version"'

          echo -e "\n====================================="
          echo "📄 package.json 版本号"
          echo "====================================="
          cat package.json | grep '"version"'
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get npm cache directory
        id: npm-cache
        shell: bash
        run: echo "DIR=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.DIR }}
          key: ${{ runner.os }}-npm-arm64-${{ hashFiles(format('{0}/package.json', env.SOURCE_DIR)) }}
          restore-keys: ${{ runner.os }}-npm-arm64-

      - name: Install frontend dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install

      - name: Install macOS system dependencies
        run: |
          brew install libpq mysql-client openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mysql-client)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SOURCE_DIR }}/src-tauri -> target
          shared-key: macos-arm64

      - name: Inject version and patch build command in tauri.conf.json
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          jq --arg v "$VERSION" \
            '.version = $v
             | .productName = ("AIPCowork-" + $v)
             | .build.beforeBuildCommand = (.build.beforeBuildCommand | gsub("pnpm build"; "npm run build"))
             | .build.beforeDevCommand = (.build.beforeDevCommand | gsub("pnpm dev"; "npm run dev"))' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp.json && \
            mv src-tauri/tauri.conf.tmp.json src-tauri/tauri.conf.json

      - name: Build Tauri app
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          export CFLAGS="-arch arm64"
          export OPENSSL_STATIC=1
          export OPENSSL_VENDORED=1
          export CC="clang"
          export AR="ar"
          npx tauri build --target aarch64-apple-darwin

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-${{ needs.determine-version.outputs.version }}-macOS-arm64-dmg
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-${{ needs.determine-version.outputs.version }}-macOS-arm64-app
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

      # ===================== 七牛上传 macOS Arm64 =====================
      - name: Install qshell
        run: brew install qshell

      - name: Upload macOS DMG to Qiniu
        run: |
          qshell account "${{ secrets.QINIU_ACCESS_KEY }}" "${{ secrets.QINIU_SECRET_KEY }}" "github-action"
          
          DMG_PATH=$(ls ${{ env.SOURCE_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          SAVE_NAME="${{ env.QINIU_DIR }}Cowork-latest-macOS-arm64.dmg" 
          
          qshell rput --overwrite ${{ env.QINIU_BUCKET }} "$SAVE_NAME" "$DMG_PATH"
          echo "✅ 上传成功：https://${{ env.QINIU_DOMAIN }}/$SAVE_NAME"
      # =================================================================

  build-windows:
    needs: [determine-version]
    name: Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: ${{ env.SOURCE_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get npm cache directory
        id: npm-cache
        shell: bash
        run: echo "DIR=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.DIR }}
          key: ${{ runner.os }}-npm-${{ hashFiles(format('{0}/package.json', env.SOURCE_DIR)) }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install

      - name: Install OpenSSL via vcpkg
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SOURCE_DIR }}/src-tauri -> target

      - name: Inject version and patch build command in tauri.conf.json
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          echo "Setting version to: $VERSION"
          jq --arg v "$VERSION" \
            '.version = $v
             | .productName = ("AIPCowork-" + $v)
             | .build.beforeBuildCommand = (.build.beforeBuildCommand | gsub("pnpm build"; "npm run build"))
             | .build.beforeDevCommand = (.build.beforeDevCommand | gsub("pnpm dev"; "npm run dev"))' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp.json && \
            mv src-tauri/tauri.conf.tmp.json src-tauri/tauri.conf.json

      - name: Build Tauri app
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          OPENSSL_DIR: C:\vcpkg\installed\x64-windows-static
          OPENSSL_STATIC: '1'
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-${{ needs.determine-version.outputs.version }}-Windows-x64-installer
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-${{ needs.determine-version.outputs.version }}-Windows-x64-msi
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      # ===================== 七牛上传 Windows x64 =====================
      - name: Install qshell (Windows)
        run: |
          curl -L https://github.com/qiniu/qshell/releases/download/v2.18.0/qshell-v2.18.0-windows-amd64.zip -o qshell.zip
          powershell -Command "Expand-Archive qshell.zip -DestinationPath C:\Windows"
          qshell version

      - name: Upload Windows EXE to Qiniu
        run: |
          qshell account "${{ secrets.QINIU_ACCESS_KEY }}" "${{ secrets.QINIU_SECRET_KEY }}" "github-action"
          
          $exe = Get-ChildItem "${{ env.SOURCE_DIR }}/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          $SAVE_NAME = "${{ env.QINIU_DIR }}Cowork-latest-Windows-x64.exe"
          
          qshell rput --overwrite ${{ env.QINIU_BUCKET }} $SAVE_NAME $exe.FullName
          echo "✅ 上传成功：https://${{ env.QINIU_DOMAIN }}/$SAVE_NAME"
      # =================================================================

  release:
    name: Create Release
    needs: [determine-version, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Build Artifacts ==="
          find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: AIPCowork ${{ needs.determine-version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
