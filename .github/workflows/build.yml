name: build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '指定要构建的 Git tag（留空则使用最新 tag）'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [trigger-build]

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '24'
  SOURCE_DIR: source
  QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
  QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
  QINIU_DIR: aip-cowork-releases/

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      tag: ${{ steps.extract-version.outputs.TAG }}

    steps:
      - name: Clone source repository and checkout target tag
        id: clone-tag
        shell: bash
        run: |
          # 1. 处理仓库地址
          REPO="${{ secrets.COWORK_GIT_REPOSITORY_URL }}"
          REPO="${REPO#https://}"
          REPO="${REPO#http://}"
          AUTH_URL="https://${{ secrets.COWORK_GIT_REPOSITORY_USER }}:${{ secrets.COWORK_GIT_REPOSITORY_PASSWORD }}@${REPO}"

          # 2. 克隆代码（强制指定目录）
          git clone "$AUTH_URL" source
          cd source || exit 1

          # 3. 获取最新 tag
          git fetch --tags
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            SELECTED_TAG="${{ github.event.inputs.tag }}"
          else
            SELECTED_TAG=$(git tag --sort=-creatordate | head -1)
          fi

          # 4. 切换到正确 tag
          git checkout "$SELECTED_TAG"

          # 5. 输出结果
          echo "SELECTED_TAG=$SELECTED_TAG" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        id: extract-version
        shell: bash
        run: |
          TAG="${{ steps.clone-tag.outputs.SELECTED_TAG }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: source
          retention-days: 1

  build-macos-arm64:
    needs: [determine-version]
    name: macOS (Arm64)
    runs-on: macos-latest
    
    steps:
      - name: Download source code
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get npm cache directory
        id: npm-cache
        shell: bash
        run: echo "DIR=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.DIR }}
          key: ${{ runner.os }}-npm-arm64-${{ hashFiles('source/package.json') }}
          restore-keys: ${{ runner.os }}-npm-arm64-

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Install macOS dependencies
        run: |
          brew install libpq mysql-client openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mysql-client)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target

      - name: Patch version
        working-directory: source
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          jq --arg v "$VERSION" \
            '.version = $v | .productName = "AIPCowork-$v" | .build.beforeBuildCommand = "npm run build" | .build.beforeDevCommand = "npm run dev"' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build
        working-directory: source
        run: |
          export CFLAGS="-arch arm64"
          export OPENSSL_STATIC=1
          npx tauri build --target aarch64-apple-darwin

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-macOS-arm64
          path: source/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload to Qiniu
        run: |
          brew install qshell
          qshell account "${{ secrets.QINIU_ACCESS_KEY }}" "${{ secrets.QINIU_SECRET_KEY }}"
          DMG=$(ls source/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          qshell rput --overwrite ${{ env.QINIU_BUCKET }} "${{ env.QINIU_DIR }}AIPCowork-latest-macOS-arm64.dmg" "$DMG"

  build-windows:
    needs: [determine-version]
    name: Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-code
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('source/package.json') }}

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Install OpenSSL
        run: |
          vcpkg install openssl:x64-windows-static

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target

      - name: Patch version
        working-directory: source
        shell: bash
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v | .productName = "AIPCowork-$v"' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build
        working-directory: source
        env:
          OPENSSL_DIR: C:\vcpkg\installed\x64-windows-static
          OPENSSL_STATIC: 1
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-Windows-x64
          path: source/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Upload to Qiniu
        run: |
          curl -L https://github.com/qiniu/qshell/releases/download/v2.18.0/qshell-v2.18.0-windows-amd64.zip -o qshell.zip
          powershell -Command "Expand-Archive qshell.zip -DestinationPath C:\Windows"
          qshell account "${{ secrets.QINIU_ACCESS_KEY }}" "${{ secrets.QINIU_SECRET_KEY }}"
          $exe = Get-ChildItem "source/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          qshell rput --overwrite ${{ env.QINIU_BUCKET }} "${{ env.QINIU_DIR }}AIPCowork-latest-Windows-x64.exe" $exe.FullName

  release:
    needs: [determine-version, build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: AIPCowork ${{ needs.determine-version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
