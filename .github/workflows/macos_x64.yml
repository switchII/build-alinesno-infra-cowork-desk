name: build mac-os x64 (intel)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "指定要构建的 Git tag（留空则使用最新 tag）"
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [trigger-build]

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: "24"
  SOURCE_DIR: "source"
  QINIU_DIR: "aip-cowork-releases/"

jobs:
  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-15-intel
    steps:
      - name: Checkout source code
        shell: bash
        run: |
          REPO="${{ secrets.COWORK_GIT_REPOSITORY_URL }}"
          REPO="${REPO#https://}"
          REPO="${REPO#http://}"
          AUTH_URL="https://${{ secrets.COWORK_GIT_REPOSITORY_USER }}:${{ secrets.COWORK_GIT_REPOSITORY_PASSWORD }}@${REPO}"

          # 克隆代码
          git clone "$AUTH_URL" ${{ env.SOURCE_DIR }}
          cd ${{ env.SOURCE_DIR }}

          # 获取最新 Tag
          git fetch --tags
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            SELECTED_TAG="${{ github.event.inputs.tag }}"
          else
            SELECTED_TAG=$(git tag --sort=-creatordate | head -n 1)
          fi

          # 切换到正确的 Tag
          git checkout "$SELECTED_TAG"

          # 输出版本信息
          echo "SELECTED_TAG=$SELECTED_TAG" >> $GITHUB_ENV
          echo "VERSION=${SELECTED_TAG#v}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install

      - name: Install macOS dependencies
        run: |
          brew install libpq mysql-client openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mysql-client)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Patch tauri config
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          VERSION=${{ env.VERSION }}
          jq --arg v "$VERSION" '.version = $v | .productName = "AIPCowork-$v" | .build.beforeBuildCommand = "npm run build" | .build.beforeDevCommand = "npm run dev"' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build Tauri App
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          export CFLAGS="-arch x86_64"
          export OPENSSL_STATIC=1
          npx tauri build --target x86_64-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-${{ env.VERSION }}-macOS-x64-dmg
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload APP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPCowork-${{ env.VERSION }}-macOS-x64-app
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

      - name: Install qshell
        run: brew install qshell

      - name: Upload to Qiniu
        run: |
          qshell account "${{ secrets.QINIU_ACCESS_KEY }}" "${{ secrets.QINIU_SECRET_KEY }}" github-action
          DMG=$(ls ${{ env.SOURCE_DIR }}/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          SAVE_NAME="${{ env.QINIU_DIR }}AIPCowork-latest-macOS-x64.dmg"
          qshell rput --overwrite ${{ secrets.QINIU_BUCKET }} "$SAVE_NAME" "$DMG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SELECTED_TAG }}
          name: AIPCowork ${{ env.VERSION }} (macOS x64)
          draft: true
          files: |
            ${{ env.SOURCE_DIR }}/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            ${{ env.SOURCE_DIR }}/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
