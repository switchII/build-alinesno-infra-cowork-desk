name: build windows x64 (CLI Sign · 厂家 Logo 版)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '指定要构建的 Git tag（留空则使用最新 tag）'
        required: false
        default: ''
        type: string
      brand:
        description: '厂家标识（英文/数字/英文+数字，如 ACME、1001、acme01）：写进产品名与安装包文件名，如 Cowork-ACME_5.5.5-ACME_x64-setup.exe'
        required: false
        default: ''
        type: string
      logo_url:
        description: '厂家 Logo 的 PNG 直链（正方形、建议 ≥1024x1024、透明底）：下载后替换 src-tauri/icons 全套图标；留空则沿用仓库自带图标'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [trigger-build]
  workflow_call:
    inputs:
      tag:
        description: 'Git tag'
        required: false
        default: ''
        type: string
      brand:
        description: '厂家标识（英文/数字/英文+数字）'
        required: false
        default: ''
        type: string
      logo_url:
        description: '厂家 Logo 的 PNG 直链'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: 24
  SOURCE_DIR: source

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    
    steps:
      - name: Clone source repository and checkout target tag
        id: clone-tag
        shell: bash
        run: |
          REPO="${{ secrets.COWORK_GIT_REPOSITORY_URL }}"
          REPO="${REPO#https://}"
          REPO="${REPO#http://}"
          REPO_URL="https://${{ secrets.COWORK_GIT_REPOSITORY_USER }}:${{ secrets.COWORK_GIT_REPOSITORY_PASSWORD }}@${REPO}"
          
          git clone "$REPO_URL" source
          cd source
          
          echo "===> 拉取最新 Tags..."
          git fetch --tags --force
          
          echo "===> 仓库所有 Tags："
          git tag --list
          
          if [ -n "${{ inputs.tag }}" ]; then
            SELECTED_TAG="${{ inputs.tag }}"
            echo "===> 使用手动输入的 Tag：$SELECTED_TAG"
          else
            echo "===> 未输入 Tag，自动获取最新 Tag..."
            SELECTED_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --tags --max-count=1 | xargs git describe --tags 2>/dev/null)
            if [ -z "$SELECTED_TAG" ]; then
              echo "❌ 错误：仓库中没有任何 Tag！"
              exit 1
            fi
            echo "===> 自动获取到最新 Tag：$SELECTED_TAG"
          fi
          
          git checkout "$SELECTED_TAG"
          echo "===> 最终使用的 Tag：$SELECTED_TAG"
          echo "SELECTED_TAG=$SELECTED_TAG" >> $GITHUB_OUTPUT

          echo -e "\n====================================="
          echo "📄 查看文件：src-tauri/tauri.conf.json"
          echo "====================================="
          cat src-tauri/tauri.conf.json
          echo -e "=====================================\n"

          echo -e "\n====================================="
          echo "📝 最后一次 Git 提交日志"
          echo "====================================="
          git log -1 --stat
          
      - name: Extract version from tag
        id: extract-version
        shell: bash
        env:
          BRAND_INPUT: ${{ inputs.brand }}
        run: |
          TAG="${{ steps.clone-tag.outputs.SELECTED_TAG }}"
          VERSION="${TAG#v}"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SELECTED_TAG=$TAG" >> $GITHUB_ENV
          
          # 厂家标识只作用于「产品名 + 安装包文件名」，不写进 tauri 的 config.version：
          # MSI 的产品版本字段只吃纯数字 major.minor.patch，掺标识会让整包打不出来。
          BRAND="${BRAND_INPUT:-}"
          if [ -n "$BRAND" ] && ! printf '%s' "$BRAND" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "❌ brand 只能包含英文字母和数字（收到：$BRAND）"
            exit 1
          fi
          LABEL="$VERSION"
          PKG_NAME="Cowork"
          if [ -n "$BRAND" ]; then
            LABEL="${VERSION}-${BRAND}"
            PKG_NAME="Cowork-${BRAND}"
          fi
          echo "BRAND=$BRAND" >> $GITHUB_ENV
          echo "LABEL=$LABEL" >> $GITHUB_ENV
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV

          echo "✅ 最终版本信息："
          echo "Tag = $TAG"
          echo "版本号 = $VERSION"
          echo "厂家标识 = ${BRAND:-（未指定）}"
          echo "产品名 = $PKG_NAME"
          echo "文件名版本 = $LABEL"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: pnpm install --frozen-lockfile

      - name: 下载厂家 Logo 并替换整套图标（含 exe/安装包图标）
        id: brand-icon
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        env:
          LOGO_URL: ${{ inputs.logo_url }}
        run: |
          set -euo pipefail
          if [ -z "${LOGO_URL}" ]; then
            echo "==> 未传 logo_url，沿用仓库自带图标"
            exit 0
          fi

          echo "==> 下载 Logo: $LOGO_URL"
          curl -fL --retry 3 --retry-delay 2 -o vendor-logo.png "$LOGO_URL"

          # 图本身的校验交给 tauri icon：非 PNG、非正方形都直接报错退出
          # （实测提示 “Invalid PNG signature” / “Source image must be square”）。
          # 输出目录默认就是 tauri.conf.json 旁的 icons，覆盖 32x32/128x128/128x128@2x/
          # icon.ico/icon.icns/Square*/StoreLogo —— 正是 bundle.icon 引用的那几张；
          # cargo 对 bundle.icon 里的文件有 rerun-if-changed（tauri-build 2.6.2 的
          # codegen/context.rs），所以 exe 资源、窗口/托盘图标（default_window_icon）都会跟着换。
          pnpm run tauri icon vendor-logo.png
          rm -f vendor-logo.png
          ls -l src-tauri/icons/icon.ico src-tauri/icons/32x32.png src-tauri/icons/128x128@2x.png

      - name: Install OpenSSL via vcpkg
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SOURCE_DIR }}/src-tauri -> target
          
      - name: Verify code version
        shell: bash
        run: | 
          cd ${{ env.SOURCE_DIR }}
          
          echo "====================================="
          echo "✅ 验证代码版本（无git，不报错）"
          echo "====================================="

          echo -e "\n====================================="
          echo "📄 src-tauri/tauri.conf.json 版本号"
          echo "====================================="
          cat src-tauri/tauri.conf.json | grep '"version"'

          echo -e "\n====================================="
          echo "📄 package.json 版本号"
          echo "====================================="
          cat package.json | grep '"version"'
        
      - name: Patch tauri.conf.json
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          echo "====== 开始版本配置 ======"
          cat src-tauri/tauri.conf.json | grep '"version"'
          echo "=========================="

          VERSION=${{ steps.extract-version.outputs.VERSION }}
           
          # 产品名带厂家标识：exe 文件名、开始菜单、控制面板里的名字都跟着变
          jq --arg v "$VERSION" --arg p "${{ env.PKG_NAME }}" \
            '.version = $v | .productName = $p | .build.beforeBuildCommand = "pnpm run build" | .build.beforeDevCommand = "pnpm run dev" | .bundle.resources = ["runtimes/python/**/*", "runtimes/node/**/*", "runtimes/git/**/*", "runtimes/pandoc/**/*", "runtimes/uv/**/*"]' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
 
          echo "====== 版本配置完成 ======"
          cat src-tauri/tauri.conf.json | grep '"version"'
          echo "=========================="
            
      - name: 🔍 打印最终 tauri.conf.json（排查版本）
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          echo "====== 最终版本配置 ======"
          cat src-tauri/tauri.conf.json | grep '"version"'
          echo "=========================="

      - name: Resolve bundled runtimes fingerprint
        id: runtimes
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          # 缓存 key 由「download-runtimes.sh + requirements-base.txt」的内容决定：
          # 脚本里任何版本号（Node/Python/Git/Pandoc）或 base 包清单变化都会自动换 key。
          # 以前是手写字面量，出现过脚本升到 Node 22、key 还写着 node20，命中旧缓存后
          # 目录存在即跳过下载，把过期运行时/过期 wheel 打进了安装包。
          FP="$( (cat scripts/download-runtimes.sh scripts/requirements-base.txt || true) | (sha256sum 2>/dev/null || shasum -a 256) | cut -c1-16)"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "==> bundled runtimes fingerprint: $FP"

      - name: Cache bundled runtimes
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_DIR }}/src-tauri/runtimes
          key: runtimes-win-x64-${{ steps.runtimes.outputs.fingerprint }}
          # 禁止部分命中：命中到别的指纹的缓存，等于把不匹配的运行时打进安装包
          restore-keys: ""

      - name: Download bundled runtimes (Windows)
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          chmod +x scripts/download-runtimes.sh
          # 内容级校验：比对产物里的指纹与当前脚本指纹，而不是只看目录是否存在
          CACHED_FP="$(cat src-tauri/runtimes/.fingerprint 2>/dev/null || echo none)"
          if [ "$CACHED_FP" = "${{ steps.runtimes.outputs.fingerprint }}" ]; then
            echo "==> Using cached runtimes (fingerprint $CACHED_FP matched)"
          else
            echo "==> 指纹不匹配（cached=$CACHED_FP），重新下载 bundled runtimes"
            bash scripts/download-runtimes.sh windows-x64
          fi
          echo "=== Bundled runtimes ==="
          ls src-tauri/runtimes/python/ | head -5
          ls src-tauri/runtimes/node/ | head -5
          ls src-tauri/runtimes/git/ | head -5
          ls src-tauri/runtimes/pandoc/ | head -5
          ls src-tauri/runtimes/uv/ | head -5

      - name: Build Tauri Windows x64
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          OPENSSL_DIR: C:\vcpkg\installed\x64-windows-static
          OPENSSL_STATIC: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run tauri build

      # ===================== 下载签名工具 =====================
      - name: Download EVSign CLI (SignClient.exe)
        shell: bash
        run: |
          SIGN_TOOL_DIR="C:/evsign-cli"
          mkdir -p "$SIGN_TOOL_DIR"

          # 下载链接中包含中文文件名（自助签名工具_v2.3.3.exe），保存为英文避免编码问题
          DOWNLOAD_URL="https://down.evsign.cn/software/%E8%87%AA%E5%8A%A9%E7%AD%BE%E5%90%8D%E5%B7%A5%E5%85%B7_v2.3.3.exe"
          SIGN_CLIENT_PATH="$SIGN_TOOL_DIR/SignClient.exe"

          echo "====== 下载 EVSign 自助签名工具 v2.3.3 ======"
          echo "下载地址: $DOWNLOAD_URL"
          echo "保存路径: $SIGN_CLIENT_PATH"

          curl -L -o "$SIGN_CLIENT_PATH" "$DOWNLOAD_URL"
          CURL_EXIT=$?
          if [ $CURL_EXIT -ne 0 ]; then
            echo "❌ 下载失败，curl 退出码: $CURL_EXIT"
            exit 1
          fi

          if [ -f "$SIGN_CLIENT_PATH" ]; then
            FILE_SIZE=$(du -h "$SIGN_CLIENT_PATH" | cut -f1)
            echo "✅ 下载完成: $SIGN_CLIENT_PATH ($FILE_SIZE)"
          else
            echo "❌ SignClient.exe 下载后不存在"
            exit 1
          fi

          # 写入环境变量供后续步骤使用
          echo "$SIGN_TOOL_DIR" >> "$GITHUB_PATH"
          echo "SIGN_CLIENT_PATH=$SIGN_CLIENT_PATH" >> "$GITHUB_ENV"
          echo "====== 签名工具准备就绪 ======"
      # =====================================================

      # ===================== 代码签名 (CLI) =====================
      - name: Sign installers (CLI)
        id: cli-sign
        shell: bash
        env:
          EV_SIGN_KEY: ${{ secrets.EV_SIGN_KEY }}
        run: |
          set -e
          SIGN_CLIENT="$SIGN_CLIENT_PATH"
          if [ -z "$SIGN_CLIENT" ]; then
            SIGN_CLIENT="C:/evsign-cli/SignClient.exe"
          fi
          if [ ! -f "$SIGN_CLIENT" ]; then
            echo "❌ SignClient.exe 不存在: $SIGN_CLIENT"
            exit 1
          fi

          echo "====== 开始 CLI 签名安装包 ======"
          echo "签名工具路径: $SIGN_CLIENT"

          SIGN_SUCCESS=true

          # 签名 NSIS (.exe)
          EXE_FILE=$(ls ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -n "$EXE_FILE" ]; then
            echo ""
            echo "==> 签名 NSIS: $(basename "$EXE_FILE")"
            echo "==> 文件路径: $EXE_FILE"
            EXE_SIZE=$(du -h "$EXE_FILE" | cut -f1)
            echo "==> 文件大小: $EXE_SIZE"

            SIGN_OUTPUT=$("$SIGN_CLIENT" "$EXE_FILE" -key "$EV_SIGN_KEY" 2>&1) || true
            EXIT_CODE=$?
            echo "------ SignClient 输出 ------"
            echo "$SIGN_OUTPUT"
            echo "------ 退出码: $EXIT_CODE ------"

            # 判断签名是否成功：检查输出中是否包含"签名完成"且退出码为 0
            if echo "$SIGN_OUTPUT" | grep -q "签名完成" && [ "$EXIT_CODE" -eq 0 ]; then
              echo "✅ NSIS 签名成功: $(basename "$EXE_FILE")"
              echo "EVSIGN_NSIS_RESULT=SUCCESS" >> "$GITHUB_OUTPUT"
            else
              echo "❌ NSIS 签名失败！退出码=$EXIT_CODE"
              echo "EVSIGN_NSIS_RESULT=FAILED" >> "$GITHUB_OUTPUT"
              SIGN_SUCCESS=false
            fi
          else
            echo "⚠️ 未找到 NSIS .exe 文件，跳过签名"
            echo "EVSIGN_NSIS_RESULT=SKIPPED" >> "$GITHUB_OUTPUT"
          fi

          # 签名 MSI (.msi)
          MSI_FILE=$(ls ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/msi/*.msi 2>/dev/null | head -1)
          if [ -n "$MSI_FILE" ]; then
            echo ""
            echo "==> 签名 MSI: $(basename "$MSI_FILE")"
            echo "==> 文件路径: $MSI_FILE"
            MSI_SIZE=$(du -h "$MSI_FILE" | cut -f1)
            echo "==> 文件大小: $MSI_SIZE"

            SIGN_OUTPUT=$("$SIGN_CLIENT" "$MSI_FILE" -key "$EV_SIGN_KEY" 2>&1) || true
            EXIT_CODE=$?
            echo "------ SignClient 输出 ------"
            echo "$SIGN_OUTPUT"
            echo "------ 退出码: $EXIT_CODE ------"

            if echo "$SIGN_OUTPUT" | grep -q "签名完成" && [ "$EXIT_CODE" -eq 0 ]; then
              echo "✅ MSI 签名成功: $(basename "$MSI_FILE")"
              echo "EVSIGN_MSI_RESULT=SUCCESS" >> "$GITHUB_OUTPUT"
            else
              echo "❌ MSI 签名失败！退出码=$EXIT_CODE"
              echo "EVSIGN_MSI_RESULT=FAILED" >> "$GITHUB_OUTPUT"
              SIGN_SUCCESS=false
            fi
          else
            echo "⚠️ 未找到 MSI .msi 文件，跳过签名"
            echo "EVSIGN_MSI_RESULT=SKIPPED" >> "$GITHUB_OUTPUT"
          fi

          # 汇总签名结果
          echo ""
          echo "====== 签名结果汇总 ======"
          if [ -n "$EXE_FILE" ]; then
            echo "NSIS (.exe): $([ "$SIGN_SUCCESS" = true ] && [ -n "$EXE_FILE" ] && echo '✅ 成功' || echo '❌ 失败')"
          else
            echo "NSIS (.exe): ⚠️ 跳过"
          fi
          echo "=========================="

          if [ "$SIGN_SUCCESS" = "false" ]; then
            echo "❌ 存在签名失败的文件，中止构建"
            exit 1
          fi

          echo "====== CLI 签名全部完成 ======"
      # =====================================================

      # ===================== 安装包文件名补上厂家标识 =====================
      - name: 安装包文件名补上厂家标识
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        env:
          BRAND: ${{ inputs.brand }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -uo pipefail
          if [ -z "${BRAND}" ]; then
            echo "==> 未传 brand，安装包文件名保持原样"
            exit 0
          fi
          # 产品名已带标识（Cowork-ACME_5.5.5_x64-setup.exe），这里再把版本段补成
          # 5.5.5-ACME，exe/msi 和它们的 .sig/.zip 一起改，名字和内容依旧成对
          shopt -s nullglob
          for dir in nsis msi; do
            for f in "src-tauri/target/release/bundle/$dir"/*"${VERSION}"*; do
              base=$(basename "$f")
              mv "$f" "$(dirname "$f")/${base/$VERSION/$VERSION-$BRAND}"
            done
          done
          echo "==> 改名后的安装包："
          ls -l src-tauri/target/release/bundle/nsis src-tauri/target/release/bundle/msi
      # ===================================================================

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ env.LABEL }}-Windows-x64-installer
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ env.LABEL }}-Windows-x64-msi
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/msi/*.msi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SELECTED_TAG }}
          name: ${{ env.PKG_NAME }} ${{ env.LABEL }} (Windows x64)
          draft: true
          files: |
            ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
