name: build windows x64 (CLI Sign)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '指定要构建的 Git tag（留空则使用最新 tag）'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [trigger-build]

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: 24
  SOURCE_DIR: source
  QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
  QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    
    steps:
      - name: Clone source repository and checkout target tag
        id: clone-tag
        shell: bash
        run: |
          REPO="${{ secrets.COWORK_GIT_REPOSITORY_URL }}"
          REPO="${REPO#https://}"
          REPO="${REPO#http://}"
          REPO_URL="https://${{ secrets.COWORK_GIT_REPOSITORY_USER }}:${{ secrets.COWORK_GIT_REPOSITORY_PASSWORD }}@${REPO}"
          
          git clone "$REPO_URL" source
          cd source
          
          echo "===> 拉取最新 Tags..."
          git fetch --tags --force
          
          echo "===> 仓库所有 Tags："
          git tag --list
          
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            SELECTED_TAG="${{ github.event.inputs.tag }}"
            echo "===> 使用手动输入的 Tag：$SELECTED_TAG"
          else
            echo "===> 未输入 Tag，自动获取最新 Tag..."
            SELECTED_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --tags --max-count=1 | xargs git describe --tags 2>/dev/null)
            if [ -z "$SELECTED_TAG" ]; then
              echo "❌ 错误：仓库中没有任何 Tag！"
              exit 1
            fi
            echo "===> 自动获取到最新 Tag：$SELECTED_TAG"
          fi
          
          git checkout "$SELECTED_TAG"
          echo "===> 最终使用的 Tag：$SELECTED_TAG"
          echo "SELECTED_TAG=$SELECTED_TAG" >> $GITHUB_OUTPUT

          echo -e "\n====================================="
          echo "📄 查看文件：src-tauri/tauri.conf.json"
          echo "====================================="
          cat src-tauri/tauri.conf.json
          echo -e "=====================================\n"

          echo -e "\n====================================="
          echo "📝 最后一次 Git 提交日志"
          echo "====================================="
          git log -1 --stat
          
      - name: Extract version from tag
        id: extract-version
        shell: bash
        run: |
          TAG="${{ steps.clone-tag.outputs.SELECTED_TAG }}"
          VERSION="${TAG#v}"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SELECTED_TAG=$TAG" >> $GITHUB_ENV
          
          echo "✅ 最终版本信息："
          echo "Tag = $TAG"
          echo "版本号 = $VERSION"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install

      - name: Install OpenSSL via vcpkg
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SOURCE_DIR }}/src-tauri -> target
          
      - name: Verify code version
        shell: bash
        run: | 
          cd ${{ env.SOURCE_DIR }}
          
          echo "====================================="
          echo "✅ 验证代码版本（无git，不报错）"
          echo "====================================="

          echo -e "\n====================================="
          echo "📄 src-tauri/tauri.conf.json 版本号"
          echo "====================================="
          cat src-tauri/tauri.conf.json | grep '"version"'

          echo -e "\n====================================="
          echo "📄 package.json 版本号"
          echo "====================================="
          cat package.json | grep '"version"'
        
      - name: Patch tauri.conf.json
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          echo "====== 开始版本配置 ======"
          cat src-tauri/tauri.conf.json | grep '"version"'
          echo "=========================="

          VERSION=${{ steps.extract-version.outputs.VERSION }}
           
          jq --arg v "$VERSION" \
            '.version = $v | .productName = "Cowork" | .build.beforeBuildCommand = "npm run build" | .build.beforeDevCommand = "npm run dev" | .bundle.resources = ["runtimes/python/**/*", "runtimes/node/**/*", "runtimes/git/**/*", "runtimes/pandoc/**/*"]' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
 
          echo "====== 版本配置完成 ======"
          cat src-tauri/tauri.conf.json | grep '"version"'
          echo "=========================="
            
      - name: 🔍 打印最终 tauri.conf.json（排查版本）
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          echo "====== 最终版本配置 ======"
          cat src-tauri/tauri.conf.json | grep '"version"'
          echo "=========================="

      - name: Cache bundled runtimes
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_DIR }}/src-tauri/runtimes
          key: runtimes-win-x64-node20-py312-git247-pandoc364-v1

      - name: Download bundled runtimes (Windows)
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          if [ ! -d "src-tauri/runtimes/python" ] || [ ! -d "src-tauri/runtimes/node" ] || [ ! -d "src-tauri/runtimes/git" ] || [ ! -d "src-tauri/runtimes/pandoc" ]; then
            chmod +x scripts/download-runtimes.sh
            bash scripts/download-runtimes.sh windows-x64
          else
            echo "==> Using cached runtimes"
          fi
          echo "=== Bundled runtimes ==="
          ls src-tauri/runtimes/python/ | head -5
          ls src-tauri/runtimes/node/ | head -5
          ls src-tauri/runtimes/git/ | head -5
          ls src-tauri/runtimes/pandoc/ | head -5

      - name: Build Tauri Windows x64
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          OPENSSL_DIR: C:\vcpkg\installed\x64-windows-static
          OPENSSL_STATIC: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # ===================== 下载签名工具 =====================
      - name: Download EVSign CLI (SignClient.exe)
        shell: powershell
        run: |
          # 设置 UTF-8 编码，避免中文 URL 解析异常
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $ProgressPreference = 'SilentlyContinue'

          $signToolDir = "C:\evsign-cli"
          New-Item -ItemType Directory -Force -Path $signToolDir | Out-Null

          # 下载链接中包含中文文件名（自助签名工具_v2.3.3.exe），保存为英文避免编码问题
          $downloadUrl = "https://down.evsign.cn/software/%E8%87%AA%E5%8A%A9%E7%AD%BE%E5%90%8D%E5%B7%A5%E5%85%B7_v2.3.3.exe"
          $signClientPath = Join-Path $signToolDir "SignClient.exe"

          Write-Host "====== 下载 EVSign 自助签名工具 v2.3.3 ======"
          Write-Host "下载地址: $downloadUrl"
          Write-Host "保存路径: $signClientPath"

          try {
            Invoke-WebRequest -Uri $downloadUrl -OutFile $signClientPath -UseBasicParsing -ErrorAction Stop
          } catch {
            Write-Error "下载失败: $_"
            exit 1
          }

          if (Test-Path $signClientPath) {
            $fileSize = [math]::Round((Get-Item $signClientPath).Length / 1MB, 2)
            Write-Host "下载完成: $signClientPath ($fileSize MB)"
          } else {
            Write-Error "SignClient.exe 下载后不存在"
            exit 1
          }

          # 写入环境变量供后续步骤使用
          Add-Content -Path $env:GITHUB_PATH -Value $signToolDir
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_CLIENT_PATH=$signClientPath"
          Write-Host "SIGN_CLIENT_PATH=$signClientPath"
          Write-Host "====== 签名工具准备就绪 ======"
      # =====================================================

      # ===================== 代码签名 (CLI) =====================
      - name: Sign installers (CLI)
        id: cli-sign
        shell: powershell
        env:
          EV_SIGN_KEY: ${{ secrets.EV_SIGN_KEY }}
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $signClient = $env:SIGN_CLIENT_PATH
          if (-not $signClient) {
            # Fallback: 尝试从默认路径查找
            $signClient = (Get-ChildItem -Path "C:\evsign-cli" -Filter "SignClient.exe" -Recurse | Select-Object -First 1).FullName
          }

          if (-not $signClient -or -not (Test-Path $signClient)) {
            Write-Error "❌ SignClient.exe 不存在: $signClient"
            exit 1
          }

          Write-Host "====== 开始 CLI 签名安装包 ======"
          Write-Host "签名工具路径: $signClient"
          Write-Host "签名密钥: $($env:EV_SIGN_KEY.Substring(0,8))****"

          $signSuccess = $true
          $exeSigned = $false
          $msiSigned = $false

          # 签名 NSIS (.exe)
          $exeFile = Get-ChildItem "${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($exeFile) {
            Write-Host "`n==> 签名 NSIS: $($exeFile.Name)"
            Write-Host "==> 文件路径: $($exeFile.FullName)"
            Write-Host "==> 文件大小: $([math]::Round($exeFile.Length / 1MB, 2)) MB"

            $signOutput = & $signClient $exeFile.FullName -key $env:EV_SIGN_KEY 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            Write-Host "------ SignClient 输出 ------"
            Write-Host $signOutput
            Write-Host "------ 退出码: $exitCode ------"

            # 判断签名是否成功：检查输出中是否包含"签名完成"且退出码为 0
            if ($signOutput -match "签名完成" -and $exitCode -eq 0) {
              Write-Host "✅ NSIS 签名成功: $($exeFile.Name)"
              Write-Host "✅ EVSIGN_NSIS_RESULT=SUCCESS" >> $env:GITHUB_OUTPUT
              $exeSigned = $true
            } else {
              Write-Host "❌ NSIS 签名失败！退出码=$exitCode"
              Write-Host "❌ EVSIGN_NSIS_RESULT=FAILED" >> $env:GITHUB_OUTPUT
              $signSuccess = $false
            }
          } else {
            Write-Host "⚠️ 未找到 NSIS .exe 文件，跳过签名"
            Write-Host "⚠️ EVSIGN_NSIS_RESULT=SKIPPED" >> $env:GITHUB_OUTPUT
          }

          # 签名 MSI (.msi)
          $msiFile = Get-ChildItem "${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msiFile) {
            Write-Host "`n==> 签名 MSI: $($msiFile.Name)"
            Write-Host "==> 文件路径: $($msiFile.FullName)"
            Write-Host "==> 文件大小: $([math]::Round($msiFile.Length / 1MB, 2)) MB"

            $signOutput = & $signClient $msiFile.FullName -key $env:EV_SIGN_KEY 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            Write-Host "------ SignClient 输出 ------"
            Write-Host $signOutput
            Write-Host "------ 退出码: $exitCode ------"

            # 判断签名是否成功
            if ($signOutput -match "签名完成" -and $exitCode -eq 0) {
              Write-Host "✅ MSI 签名成功: $($msiFile.Name)"
              Write-Host "✅ EVSIGN_MSI_RESULT=SUCCESS" >> $env:GITHUB_OUTPUT
              $msiSigned = $true
            } else {
              Write-Host "❌ MSI 签名失败！退出码=$exitCode"
              Write-Host "❌ EVSIGN_MSI_RESULT=FAILED" >> $env:GITHUB_OUTPUT
              $signSuccess = $false
            }
          } else {
            Write-Host "⚠️ 未找到 MSI .msi 文件，跳过签名"
            Write-Host "⚠️ EVSIGN_MSI_RESULT=SKIPPED" >> $env:GITHUB_OUTPUT
          }

          # 汇总签名结果
          Write-Host "`n====== 签名结果汇总 ======"
          Write-Host "NSIS (.exe): $(if ($exeSigned) { '✅ 成功' } elseif ($exeFile) { '❌ 失败' } else { '⚠️ 跳过' })"
          Write-Host "MSI  (.msi): $(if ($msiSigned) { '✅ 成功' } elseif ($msiFile) { '❌ 失败' } else { '⚠️ 跳过' })"
          Write-Host "=========================="

          if (-not $signSuccess) {
            Write-Error "❌ 存在签名失败的文件，中止构建"
            exit 1
          }

          Write-Host "====== CLI 签名全部完成 ======"
      # =====================================================

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Cowork-${{ env.VERSION }}-Windows-x64-installer
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Cowork-${{ env.VERSION }}-Windows-x64-msi
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/msi/*.msi

      # ===================== 七牛云上传 =====================
      - name: Install qshell (Windows)
        run: |
          curl -L https://github.com/qiniu/qshell/releases/download/v2.18.0/qshell-v2.18.0-windows-amd64.zip -o qshell.zip
          powershell -Command "Expand-Archive qshell.zip -DestinationPath C:\Windows"
          qshell version
          
      - name: Upload Windows MSI & EXE to Qiniu
        run: |
          qshell account "${{ secrets.QINIU_ACCESS_KEY }}" "${{ secrets.QINIU_SECRET_KEY }}" "github-action"
          
          $msi = Get-ChildItem "${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          $SAVE_NAME = "aip-cowork-releases/Cowork-latest-Windows-x64.msi"
          qshell rput --overwrite ${{ secrets.QINIU_BUCKET }} $SAVE_NAME $msi.FullName
          echo "✅ MSI 上传成功：https://${{ secrets.QINIU_DOMAIN }}/$SAVE_NAME"
          
          $exe = Get-ChildItem "${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $SAVE_NAME = "aip-cowork-releases/Cowork-latest-Windows-x64.exe"
          qshell rput --overwrite ${{ secrets.QINIU_BUCKET }} $SAVE_NAME $exe.FullName
          echo "✅ EXE 上传成功：https://${{ secrets.QINIU_DOMAIN }}/$SAVE_NAME"
      # =====================================================

      # ===================== 更新 latest.json =====================
      - name: Update latest.json for Windows platform
        shell: bash
        run: |
          set -euo pipefail
          echo "====== 开始更新 latest.json (windows-x86_64) ======"

          # 列出 bundle 目录所有文件，方便排查
          echo "📂 NSIS bundle 目录内容："
          ls -la ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/ || true

          # 读取 minisign 签名
          # Tauri v2 (createUpdaterArtifacts=true): 生成 .exe.sig
          # Tauri v1 compatible: 生成 .nsis.zip.sig
          SIG_FILE=$(ls ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe.sig 2>/dev/null | head -1)
          if [ -z "$SIG_FILE" ]; then
            echo "⚠️ 未找到 .exe.sig，尝试查找 .nsis.zip.sig ..."
            SIG_FILE=$(ls ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig 2>/dev/null | head -1)
          fi
          if [ -z "$SIG_FILE" ]; then
            echo "❌ 未找到任何签名文件，列出所有 .sig 文件排查："
            find ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/ -name "*.sig" 2>/dev/null || echo "（无 .sig 文件）"
            echo "跳过 latest.json 更新"
            exit 0
          fi
          SIGNATURE=$(cat "$SIG_FILE" | tr -d '\r\n')
          echo "✅ 读取到 minisign 签名文件: $(basename "$SIG_FILE")"

          QINIU_DOMAIN="https://${{ secrets.QINIU_DOMAIN }}"
          LATEST_JSON_URL="${QINIU_DOMAIN}/aip-cowork-releases/latest.json"
          DOWNLOAD_URL="${QINIU_DOMAIN}/aip-cowork-releases/Cowork-latest-Windows-x64.exe"
          PLATFORM_KEY="windows-x86_64"

          # 下载现有 latest.json 或创建空模板
          BASE_JSON='{"version":"","notes":"","pub_date":"","platforms":{}}'
          if curl -sf -o existing_latest.json "$LATEST_JSON_URL" && [ -s existing_latest.json ]; then
            echo "✅ 已下载现有 latest.json"
            # 验证是否为合法 JSON
            if jq empty existing_latest.json 2>/dev/null; then
              BASE_JSON=$(cat existing_latest.json)
            else
              echo "⚠️ 现有 latest.json 不是合法 JSON，使用空模板"
            fi
          else
            echo "⚠️ 未找到现有 latest.json（首次构建），使用空模板"
          fi

          # 合并当前平台条目
          UPDATED_JSON=$(echo "$BASE_JSON" | jq \
            --arg v "${{ env.VERSION }}" \
            --arg notes "Cowork ${{ env.VERSION }}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$SIGNATURE" \
            --arg url "$DOWNLOAD_URL" \
            --arg pk "$PLATFORM_KEY" \
            '.version = $v | .notes = $notes | .pub_date = $pub_date | .platforms[$pk] = {"signature": $sig, "url": $url}')

          echo "$UPDATED_JSON" > latest.json
          echo "📄 生成的 latest.json:"
          cat latest.json | jq .

          # 上传 latest.json 到七牛
          qshell rput --overwrite ${{ secrets.QINIU_BUCKET }} "aip-cowork-releases/latest.json" "$(pwd)/latest.json"
          echo "✅ latest.json 已上传到七牛云"
          echo "====== latest.json 更新完成 ======"
      # ===========================================================

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SELECTED_TAG }}
          name: Cowork ${{ env.VERSION }} (Windows x64)
          draft: true
          files: |
            ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
