name: build mac-os arm64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '指定要构建的 Git tag（留空则使用最新 tag）'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [trigger-build]
  workflow_call:
    inputs:
      tag:
        description: 'Git tag'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: 24
  SOURCE_DIR: source
  QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
  QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest
    
    steps:
      - name: Clone source repository and checkout target tag
        id: clone-tag
        shell: bash
        run: |
          REPO="${{ secrets.COWORK_GIT_REPOSITORY_URL }}"
          REPO="${REPO#https://}"
          REPO="${REPO#http://}"
          REPO_URL="https://${{ secrets.COWORK_GIT_REPOSITORY_USER }}:${{ secrets.COWORK_GIT_REPOSITORY_PASSWORD }}@${REPO}"
          
          git clone "$REPO_URL" source
          cd source
          
          echo "===> 拉取最新 Tags..."
          git fetch --tags --force
          
          echo "===> 仓库所有 Tags："
          git tag --list
          
          if [ -n "${{ inputs.tag }}" ]; then
            SELECTED_TAG="${{ inputs.tag }}"
            echo "===> 使用手动输入的 Tag：$SELECTED_TAG"
          else
            echo "===> 未输入 Tag，自动获取最新 Tag..."
            SELECTED_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --tags --max-count=1 | xargs git describe --tags 2>/dev/null)
            if [ -z "$SELECTED_TAG" ]; then
              echo "❌ 错误：仓库中没有任何 Tag！"
              exit 1
            fi
            echo "===> 自动获取到最新 Tag：$SELECTED_TAG"
          fi
          
          git checkout "$SELECTED_TAG"
          echo "===> 最终使用的 Tag：$SELECTED_TAG"
          echo "SELECTED_TAG=$SELECTED_TAG" >> $GITHUB_OUTPUT

          echo -e "\n====================================="
          echo "📄 查看文件：src-tauri/tauri.conf.json"
          echo "====================================="
          cat src-tauri/tauri.conf.json
          echo -e "=====================================\n"

          echo -e "\n====================================="
          echo "📝 最后一次 Git 提交日志"
          echo "====================================="
          git log -1 --stat
          
      - name: Extract version from tag
        id: extract-version
        shell: bash
        run: |
          TAG="${{ steps.clone-tag.outputs.SELECTED_TAG }}"
          VERSION="${TAG#v}"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SELECTED_TAG=$TAG" >> $GITHUB_ENV
          
          echo "✅ 最终版本信息："
          echo "Tag = $TAG"
          echo "版本号 = $VERSION"
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Install macOS system dependencies
        run: |
          brew install libpq mysql-client openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix mysql-client)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SOURCE_DIR }}/src-tauri -> target
          shared-key: macos-arm64
          
      - name: Verify code version
        shell: bash
        run: | 
          cd ${{ env.SOURCE_DIR }}
          
          echo "====================================="
          echo "✅ 验证代码版本（无git，不报错）"
          echo "====================================="

          echo -e "\n====================================="
          echo "📄 src-tauri/tauri.conf.json 版本号"
          echo "====================================="
          cat src-tauri/tauri.conf.json | grep '"version"'

          echo -e "\n====================================="
          echo "📄 package.json 版本号"
          echo "====================================="
          cat package.json | grep '"version"'
        
      - name: Patch tauri.conf.json
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          echo "====== 开始版本配置 ======"
          cat src-tauri/tauri.conf.json | grep '"version"'
          echo "=========================="

          VERSION=${{ steps.extract-version.outputs.VERSION }}
           
          jq --arg v "$VERSION" \
            '.version = $v | .productName = "Cowork" | .build.beforeBuildCommand = "pnpm run build" | .build.beforeDevCommand = "pnpm run dev" | .bundle.resources = ["runtimes/python/**/*", "runtimes/node/**/*", "runtimes/git/**/*", "runtimes/pandoc/**/*"]' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
 
          echo "====== 版本配置完成 ======"
          cat src-tauri/tauri.conf.json | grep '"version"'
          echo "=========================="
            
      - name: 🔍 打印最终 tauri.conf.json（排查版本）
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          echo "====== 最终版本配置 ======"
          cat src-tauri/tauri.conf.json | grep '"version"'
          echo "=========================="

      - name: Cache bundled runtimes
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_DIR }}/src-tauri/runtimes
          key: runtimes-macos-arm64-node20-py312-git247-pandoc364-v1

      - name: Download bundled runtimes (macOS ARM64)
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          if [ ! -d "src-tauri/runtimes/python" ] || [ ! -d "src-tauri/runtimes/node" ] || [ ! -d "src-tauri/runtimes/git" ] || [ ! -d "src-tauri/runtimes/pandoc" ]; then
            chmod +x scripts/download-runtimes.sh
            bash scripts/download-runtimes.sh macos-arm64
          else
            echo "==> Using cached runtimes"
          fi
          echo "=== Bundled runtimes ==="
          ls src-tauri/runtimes/python/bin/ | head -5
          ls src-tauri/runtimes/node/bin/ | head -5
          ls src-tauri/runtimes/git/ | head -5
          ls src-tauri/runtimes/pandoc/ | head -5

      - name: Codesign bundled runtimes for Apple notarization
        shell: bash
        run: |
          echo "====== 开始对 bundled runtimes 进行代码签名 ======"
          
          RUNTIME_DIR="${{ env.SOURCE_DIR }}/src-tauri/runtimes"
          IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
          
          if [ -z "$IDENTITY" ]; then
            echo "⚠️ APPLE_SIGNING_IDENTITY 未设置，跳过运行时签名"
            exit 0
          fi
          
          # 导入 Apple 证书到临时 keychain
          CERT_PATH="/tmp/apple_cert.p12"
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > "$CERT_PATH"
          
          KEYCHAIN="/tmp/codesign.keychain-db"
          KEYCHAIN_PASSWORD="codesign_temp_$(date +%s)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/'"'//g)
          
          rm -f "$CERT_PATH"
          echo "✅ 证书已导入临时 keychain"
          
          # 查找所有 Mach-O 二进制文件并签名
          SIGN_COUNT=0
          SIGN_FAIL=0
          
          while IFS= read -r -d '' file; do
            # 只对 Mach-O 文件签名
            if file "$file" | grep -q "Mach-O"; then
              echo "  Signing: $file"
              if codesign --force --options runtime --sign "$IDENTITY" --timestamp "$file" 2>&1; then
                SIGN_COUNT=$((SIGN_COUNT + 1))
              else
                echo "  ⚠️ Failed to sign: $file"
                SIGN_FAIL=$((SIGN_FAIL + 1))
              fi
            fi
          done < <(find "$RUNTIME_DIR" -type f -print0)
          
          echo ""
          echo "✅ 签名完成：成功 $SIGN_COUNT 个，失败 $SIGN_FAIL 个"
          
          # 清理临时 keychain
          security list-keychains -d user -s $(security list-keychains -d user | sed s/'"'//g | grep -v "$KEYCHAIN")
          security delete-keychain "$KEYCHAIN"
          
          if [ "$SIGN_FAIL" -gt 0 ]; then
            echo "❌ 有 $SIGN_FAIL 个文件签名失败，请检查"
            exit 1
          fi
          
          echo "====== bundled runtimes 代码签名完成 ======"

      - name: Build Tauri macOS ARM64
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run tauri build

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Cowork-${{ env.VERSION }}-macOS-arm64-dmg
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: Cowork-${{ env.VERSION }}-macOS-arm64-app
          path: ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/macos/*.app

      # ===================== 七牛云上传 =====================
      - name: Install qshell
        run: brew install qshell

      - name: Upload DMG to Qiniu
        run: |
          qshell account "${{ secrets.QINIU_ACCESS_KEY }}" "${{ secrets.QINIU_SECRET_KEY }}" "github-action"
          
          DMG_PATH=$(ls ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/dmg/*.dmg)

          QINIU_DIR="aip-cowork-releases/"
          SAVE_NAME="${QINIU_DIR}Cowork-${VERSION}-macOS-arm64.dmg" 
          
          qshell rput --overwrite ${{ secrets.QINIU_BUCKET }} "$SAVE_NAME" "$DMG_PATH"
          echo "✅ 上传成功：https://${{ secrets.QINIU_DOMAIN }}/$SAVE_NAME"
      # =====================================================

      # ===================== 更新 latest.json =====================
      - name: Update latest.json for macOS ARM64 platform
        shell: bash
        run: |
          echo "====== 开始更新 latest.json (darwin-aarch64) ======"

          # 读取 minisign 签名
          SIG_FILE=$(ls ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig 2>/dev/null | head -1)
          if [ -z "$SIG_FILE" ]; then
            echo "❌ 未找到 .app.tar.gz.sig 签名文件，跳过 latest.json 更新"
            exit 0
          fi
          SIGNATURE=$(cat "$SIG_FILE")
          echo "✅ 读取到 minisign 签名 ($(echo "$SIGNATURE" | wc -c) bytes)"

          QINIU_DOMAIN="https://${{ secrets.QINIU_DOMAIN }}"
          LATEST_JSON_URL="${QINIU_DOMAIN}/aip-cowork-releases/latest.json"
          DOWNLOAD_URL="${QINIU_DOMAIN}/aip-cowork-releases/Cowork-${VERSION}-macOS-arm64.dmg"
          PLATFORM_KEY="darwin-aarch64"

          # 下载现有 latest.json 或创建空模板
          if curl -sf -o existing_latest.json "$LATEST_JSON_URL"; then
            echo "✅ 已下载现有 latest.json"
            BASE_JSON=$(cat existing_latest.json)
          else
            echo "⚠️ 未找到现有 latest.json，创建空模板"
            BASE_JSON='{"version":"","notes":"","pub_date":"","platforms":{}}'
          fi

          # 合并当前平台条目
          UPDATED_JSON=$(echo "$BASE_JSON" | jq \
            --arg v "${{ env.VERSION }}" \
            --arg notes "Cowork ${{ env.VERSION }}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$SIGNATURE" \
            --arg url "$DOWNLOAD_URL" \
            --arg pk "$PLATFORM_KEY" \
            '.version = $v | .notes = $notes | .pub_date = $pub_date | .platforms[$pk] = {"signature": $sig, "url": $url}')

          echo "$UPDATED_JSON" > latest.json
          echo "📄 生成的 latest.json:"
          cat latest.json | jq .

          # 上传 latest.json 到七牛
          qshell rput --overwrite ${{ secrets.QINIU_BUCKET }} "aip-cowork-releases/latest.json" "$(pwd)/latest.json"
          echo "✅ latest.json 已上传到七牛云"
          echo "====== latest.json 更新完成 ======"
      # ===========================================================

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SELECTED_TAG }}
          name: Cowork ${{ env.VERSION }} (macOS ARM64)
          draft: true
          files: |
            ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/dmg/*.dmg
            ${{ env.SOURCE_DIR }}/src-tauri/target/release/bundle/macos/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
